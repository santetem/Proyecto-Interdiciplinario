spring.datasource.url=jdbc:mysql://localhost:3306/remax?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
server.port=8086
spring.jackson.serialization.fail-on-empty-beans=false
# ---- Pegar estas lineas AL FINAL de tu application.properties ----

# Subida de imagenes: por defecto Spring solo acepta archivos de 1 MB (una foto de celular pesa mas).
# Se deja en 10 MB y el limite real de 5 MB lo controla AlmacenImagenes con un mensaje claro.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Carpeta del disco donde se guardan las imagenes (relativa a la carpeta del proyecto)
app.uploads.dir=uploads