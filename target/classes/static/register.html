<!DOCTYPE html>
<!-- Declara que el documento es HTML5 -->
<html lang="es"> <!-- lang="es": idioma de la página (lectores de pantalla y traductor) -->
<head>
    <meta charset="UTF-8"> <!-- Codificación: permite tildes y ñ -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Usa el ancho real del celular (responsive) -->
    <title>Registrarse | REMAX</title> <!-- Texto de la pestaña -->
    <link rel="stylesheet" href="register.css"> <!-- Conecta los estilos -->
</head>
<body>

    <div class="pagina-registro"> <!-- Envoltorio de la página (sin estilos propios) -->
        <div class="tarjeta-registro"> <!-- Tarjeta de vidrio que contiene el formulario -->
            <h1>Crear Cuenta</h1>

            <!-- novalidate: desactiva los globos del navegador; las validaciones las hace register.js
                 (así todos los errores se muestran igual, en el párrafo #mensaje) -->
            <form id="registerForm" novalidate> <!-- id: lo usa el JS para encontrar el formulario -->

                <!-- Cada campo = <label for="X"> + <input id="X">. El "for" enlaza la etiqueta con su campo -->
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="María" required> <!-- required: obligatorio -->

                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" placeholder="Wang" required>

                <label for="tag">Tag (Usuario)</label>
                <input type="text" id="tag" placeholder="maria_wang" required>

                <!-- DNI: solo 8 números.
                     inputmode="numeric": el celular muestra el teclado numérico.
                     maxlength="8": no deja escribir ni pegar más de 8 caracteres.
                     autocomplete="off": evita sugerencias del navegador con datos sensibles. -->
                <label for="dni">DNI</label>
                <input type="text" id="dni" placeholder="12345678" inputmode="numeric" maxlength="8" autocomplete="off" required>
                <small class="ayuda">8 números, sin puntos ni espacios.</small>

                <!-- Fecha de nacimiento: type="date" abre un calendario.
                     Los atributos min y max los completa register.js (hoy - 120 años / hoy - 18 años). -->
                <label for="fechaNacimiento">Fecha de nacimiento</label>
                <input type="date" id="fechaNacimiento" required>
                <small class="ayuda">Tenés que ser mayor de 18 años.</small>

                <!-- Teléfono: type="tel" (teclado de teléfono en el celular) y solo números, hasta 15 -->
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" placeholder="1155667788" inputmode="numeric" maxlength="15" autocomplete="off" required>
                <small class="ayuda">Solo números, sin espacios ni guiones (mínimo 8).</small>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" placeholder="correo@ejemplo.com" required> <!-- type="email": espera formato con @ -->

                <label for="upassword">Contraseña</label>
                <input type="password" id="upassword" placeholder="••••••••" required> <!-- password: muestra puntitos -->
                <small class="ayuda">Mínimo 6 caracteres.</small>

                <!-- type="submit": al hacer clic se dispara el evento "submit" que escucha register.js -->
                <button type="submit" id="btnRegistrar">Registrarse</button>

                <!-- Acá el JS escribe el resultado o el error -->
                <p id="mensaje" aria-live="polite"></p> <!-- aria-live: los lectores de pantalla anuncian el cambio -->

                <p>
                    ¿Ya tienes una cuenta?
                    <a href="/login.html">Inicia sesión</a> <!-- "/" = desde la raíz del servidor -->
                </p>
            </form>
        </div>
    </div>

    <!-- El script va al final del body: cuando corre, el HTML de arriba ya existe -->
    <script src="register.js"></script>
</body>
</html>
